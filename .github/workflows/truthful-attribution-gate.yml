name: truthful-attribution-gate
# Thin caller for the org-reusable truthful-attribution-gate (cinatra-ai/ci),
# per the ratified truthful-attribution spec. WARN mode
# (rollout): findings are annotated, the check is ALWAYS green —
# it never fails a PR. .github/gate-suite.json names this engine in its
# truthful-attribution-gate entry (workflow + pinned): move that pin, the `uses:`
# pin and the `ref:` input below together, in one commit.
# Pinned to the immutable engine SHA 641255c8, ci `main` HEAD when the manifest
# content rule landed, ahead of the latest release tag — so
# the trailing version comment on the `uses:` line is an honest main-branch
# prerelease marker derived from that SHA (a `0.0.0-main.<sha>` form, NOT a real
# release tag — claiming one would be false metadata). It is only there to
# satisfy the repo's actions-pinned-gate, which requires a version comment.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  # actions:read is MANDATORY: the engine at 641255c8 resolves a reusable-workflow
  # check-run to its Actions run (GET /actions/runs/{id}) to verify referenced_workflows[]
  # at the pinned SHA. With an explicit permissions block, any omitted scope defaults
  # to `none`, and a called reusable workflow cannot exceed the caller's grant — so
  # omitting this causes startup_failure (red/missing check), which WARN mode CANNOT
  # rescue (it fails before any step runs). Do not drop this line.
  actions: read

jobs:
  truthful-attribution-gate:                 # caller job id MUST stay this exact string
    uses: cinatra-ai/ci/.github/workflows/truthful-attribution-gate.yml@641255c87fd063dd4c2d4d6ff1c785ba77bf2a5c # v0.0.0-main.641255c8
    with:
      mode: warn
      ref: 641255c87fd063dd4c2d4d6ff1c785ba77bf2a5c
